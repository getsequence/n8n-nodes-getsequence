name: CI

# Lints and builds on every PR and on pushes to main, so dependency-bump PRs
# (Renovate) and any change get a green/red signal before merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
