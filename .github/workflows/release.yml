name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The id-token: write
# permission authenticates to npm and auto-attaches provenance. Requires the package's
# trusted publisher to be configured on npmjs.com (repo + this workflow file).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance (Sigstore via GitHub OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
