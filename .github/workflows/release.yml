name: Publish to npm

# Publishes the package to npm with provenance whenever a GitHub Release is published.
# Provenance requires id-token: write (OIDC) and a public source repo to be verifiable.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance (Sigstore via GitHub OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
